services:
  radiobrowser-api-mcp:
    build: .
    image: radiobrowser-api-mcp:latest
    container_name: radiobrowser-api-mcp
    restart: unless-stopped
    # No `ports:` — publishing bypasses Coolify's Traefik proxy entirely.
    # `expose` keeps 50052 reachable on the project network so Traefik can
    # forward to it.
    expose:
      - "50052"
    environment:
      # Bearer token required for the mutating tools
      # (vote/click/url/add) over HTTP. Set in Coolify env vars.
      RADIO_MCP_AUTH_TOKEN: ${RADIO_MCP_AUTH_TOKEN:-}
    # Plain HTTP, so Coolify's generated Traefik labels work unmodified:
    # re-enable "Generate default labels" in Coolify and set the domain
    # on port 50052.
    healthcheck:
      # /health is in-process (no upstream Radio Browser dependency),
      # so it proves the server is up without flaky network. stdlib
      # urllib is used because the image ships no curl.
      test:
        [
          "CMD-SHELL",
          ".venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:50052/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
