services:
  radiobrowser-api-mcp:
    build: .
    image: radiobrowser-api-mcp:latest
    container_name: radiobrowser-api-mcp
    restart: unless-stopped
    # No `ports:` — publishing bypasses Coolify's Traefik proxy entirely.
    # `expose` keeps 50051 reachable on the proxy network so Traefik can
    # forward to it. Set the domain in Coolify WITH the
    # container port appended: https://<your-domain>:50051 — the port tells
    # Traefik where to forward and does NOT appear in the public URL.
    expose:
      - "50051"
    environment:
      # Bearer token required for the mutating tools
      # (vote/click/url/add) over gRPC. Set in Coolify env vars.
      RADIO_MCP_AUTH_TOKEN: ${RADIO_MCP_AUTH_TOKEN:-}
    healthcheck:
      # gRPC ListTools is in-process (no upstream Radio Browser dependency),
      # so it proves the bridge is serving without flaky network.
      test:
        [
          "CMD-SHELL",
          ".venv/bin/python -c \"import grpc, radio_mcp_pb2 as pb2, radio_mcp_pb2_grpc as p; p.RadioMcpServiceStub(grpc.insecure_channel('127.0.0.1:50051')).ListTools(pb2.ListToolsRequest(), timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
