services:
  radiobrowser-api-mcp:
    build: .
    image: radiobrowser-api-mcp:latest
    container_name: radiobrowser-api-mcp
    restart: unless-stopped
    # No `ports:` — publishing bypasses Coolify's Traefik proxy entirely
    # (that is what left the app reachable only on plain http://…:50052).
    # `expose` keeps 50052 reachable on the proxy network so Traefik can
    # terminate TLS and serve it on 443. Set the domain in Coolify WITH the
    # container port appended: https://<your-domain>:50052 — the port tells
    # Traefik where to forward and does NOT appear in the public URL.
    expose:
      - "50052"
    environment:
      # NOTE: only grpc_server.py reads this, and this container runs the
      # streamable-http transport — so it currently protects NOTHING.
      # The /mcp endpoint is unauthenticated, mutating tools included.
      RADIO_MCP_AUTH_TOKEN: ${RADIO_MCP_AUTH_TOKEN:-}
    healthcheck:
      # Streamable HTTP endpoint (Coolify-facing transport): a GET on /mcp
      # answers 406 when the app is serving (406 = needs SSE accept header,
      # but proves uvicorn + the MCP app are up).
      test:
        [
          "CMD-SHELL",
          ".venv/bin/python -c \"import sys,urllib.request,urllib.error;\\ntry:\\n    urllib.request.urlopen('http://127.0.0.1:50052/mcp',timeout=5)\\nexcept urllib.error.HTTPError as e:\\n    sys.exit(0 if e.code in (400,404,405,406) else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
