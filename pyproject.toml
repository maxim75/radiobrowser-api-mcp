[project]
name = "radiobrowser-api-mcp"
version = "0.1.0"
description = "MCP server for the Radio Browser directory API plus live ICY/Shoutcast now-playing metadata, with Streamable HTTP remote mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# BLE (blind except) is intentional: mirror failover must survive any
# network error.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["."]
